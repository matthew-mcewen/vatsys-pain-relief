# Pain Relief settings. Lines starting with # are ignored.
# On/off settings take true or false. Restart vatSys after changing anything
# except the FSD logging settings, which apply from your next connection.

# Display-scaling fixes: VSCS click areas, the strip windows, and the Audio
# Settings, Display Settings, About and Sector Configuration windows.
ScalingFixes=true

# Activate an inactive or preactive FDR when a handoff to you arrives.
HandoffAutoActivate=true

# Chime as a handoff to you arrives ("incoming"). If you haven't accepted it
# HandoffNudgeAfter seconds later, nudge, then again every HandoffNudgeEvery
# seconds for the next HandoffNudgeFor seconds. Nudges stop once the handoff is
# accepted, refused, cancelled, or the FDR is deactivated.
HandoffChime=true
HandoffNudgeAfter=10
HandoffNudgeEvery=10
HandoffNudgeFor=90

# The WAV files played. A file name is looked for in this folder; a full path
# works too. "none" plays nothing. "default" plays a Windows system sound for
# incoming and nudge, and C:\Program Files (x86)\vatSys\wav\Tone3.wav for a
# refused handoff.
HandoffIncomingSound=incoming.wav
HandoffNudgeSound=nudge.wav
HandoffRefusedSound=refused.wav

# Log every connection to <Position>_<UTC date>_<UTC start time>.txt in this
# folder, keeping only the newest FsdLogMaxFiles logs.
FsdLog=true
FsdLogMaxFiles=10
